name: QA Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # =========================================================
  # JOB 1: Pruebas unitarias y coverage
  # =========================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con coverage
        run: npm run test:coverage

      - name: Publicar reporte de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # =========================================================
  # JOB 2: E2E, BDD, Axe y Allure
  # Depende de que unit-tests termine correctamente
  # =========================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - unit-tests

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: line_white_service_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d line_white_service_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true

      BASE_URL: http://127.0.0.1:7055
      PORT: 7055
      SESSION_SECRET: qa-ci-session-secret

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: line_white_service_test
      DB_USER: postgres
      DB_PASSWORD: postgres_test

      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java para Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Inicializar base de datos de pruebas
        env:
          PGPASSWORD: postgres_test
        run: |
          psql \
            --host=localhost \
            --port=5432 \
            --username=postgres \
            --dbname=line_white_service_test \
            --file=DB/init-test-db.sql

      - name: Verificar usuario de prueba
        env:
          PGPASSWORD: postgres_test
        run: |
          psql \
            --host=localhost \
            --port=5432 \
            --username=postgres \
            --dbname=line_white_service_test \
            --command="SELECT ID_USUARIO, CEDULA, ID_TIPO_USUARIO FROM USUARIOS;"

      - name: Instalar Chromium y dependencias
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Playwright, Axe y E2E
        run: npm run test:e2e

      - name: Generar reporte Allure
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            npm run allure:generate
          else
            echo "No se encontró allure-results"
          fi

      # El script test:bdd utiliza start-server-and-test:
      # inicia Express, espera el puerto 7055 y ejecuta Cucumber.
      
      - name: Ejecutar escenarios BDD
        run: npm run test:bdd

      - name: Publicar reportes E2E y Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-reports
          path: |
            reports/playwright-html/
            reports/allure-report/
            reports/cucumber-report.json
            allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar screenshots y trazas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            reports/test-results/
            reports/cucumber-report.json
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================
  # JOB 3: Auditoría de seguridad
  # Corre en paralelo con unit-tests
  # =========================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar npm audit
        run: npm audit --audit-level=high
        
  # =========================================================
  # JOB 4: Publicar Allure en GitHub Pages
  # Solo se ejecuta después de completar correctamente E2E
  # y únicamente cuando el evento corresponde a la rama main.
  # =========================================================
  deploy-allure:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs:
      - e2e-tests

    permissions:
      contents: read
      pages: write
      id-token: write

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar artifact de pruebas E2E
        uses: actions/download-artifact@v4
        with:
          name: e2e-allure-reports
          path: artifacts

      - name: Verificar reporte Allure
        run: |
          echo "Contenido descargado:"
          find artifacts -maxdepth 4 -type f | head -50

          if [ ! -f "artifacts/reports/allure-report/index.html" ]; then
            echo "No se encontró el archivo index.html de Allure"
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar reporte para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/reports/allure-report

      - name: Publicar reporte Allure
        id: deployment
        uses: actions/deploy-pages@v4
  # =========================================================
  # JOB 5: Análisis estático con SonarQube Cloud
  # =========================================================
  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs:
      - unit-tests

    steps:
      - name: Descargar repositorio completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Generar coverage para SonarCloud
        run: npm run test:coverage

      - name: Ejecutar análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # =========================================================
  # JOB: Cross-Browser y Cross-Device Testing
  # Chromium, Firefox, WebKit + emulación móvil/tablet
  # =========================================================
  cross-browser-tests:
    name: Cross-Browser Tests
    runs-on: ubuntu-latest

    needs:
      - unit-tests

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: line_white_service_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d line_white_service_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true

      BASE_URL: http://127.0.0.1:7055
      PORT: 7055
      SESSION_SECRET: qa-cross-browser-session-secret

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: line_white_service_test
      DB_USER: postgres
      DB_PASSWORD: postgres_test

      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:

      # -----------------------------------------------------
      # Descargar código
      # -----------------------------------------------------
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Node.js
      # -----------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # -----------------------------------------------------
      # Dependencias
      # -----------------------------------------------------
      - name: Instalar dependencias
        run: npm ci

      # -----------------------------------------------------
      # PostgreSQL
      # -----------------------------------------------------
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Inicializar base de datos de pruebas
        env:
          PGPASSWORD: postgres_test
        run: |
          psql \
            --host=localhost \
            --port=5432 \
            --username=postgres \
            --dbname=line_white_service_test \
            --file=DB/init-test-db.sql

      # -----------------------------------------------------
      # Navegadores Playwright
      # -----------------------------------------------------
      - name: Instalar navegadores Cross-Browser
        run: |
          npx playwright install --with-deps chromium firefox webkit

      # -----------------------------------------------------
      # Ejecutar suite
      # -----------------------------------------------------
      - name: Ejecutar Cross-Browser y Cross-Device Tests
        run: npm run test:cross-browser

      # -----------------------------------------------------
      # Reporte
      # -----------------------------------------------------
      - name: Publicar reporte Cross-Browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-report
          path: reports/cross-browser-html/
          if-no-files-found: ignore
          retention-days: 14

      # -----------------------------------------------------
      # Evidencias si hay fallos
      # -----------------------------------------------------
      - name: Publicar evidencias de fallos Cross-Browser
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-failure-evidence
          path: |
            test-results/
            reports/cross-browser-html/
          if-no-files-found: ignore
          retention-days: 14