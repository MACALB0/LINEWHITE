# Identificación del proyecto en SonarQube Cloud
sonar.organization=macalb0
sonar.projectKey=MACALB0_LINEWHITE
sonar.projectName=Line White Services

# Codificación
sonar.sourceEncoding=UTF-8

# Código fuente
sonar.sources=.

# Archivos de prueba
sonar.tests=tests
sonar.test.inclusions=tests/unit/**/*.js,tests/e2e/**/*.js

# Exclusiones generales
sonar.exclusions=\
node_modules/**,\
coverage/**,\
reports/**,\
allure-results/**,\
sessions/**,\
tests/**,\
public/adminlte/**,\
public/bootstrap_5_3_8/**,\
public/bootstrap-icons/**,\
public/tabulator/**

# Archivos excluidos del cálculo de coverage
sonar.coverage.exclusions=\
tests/**,\
views/**,\
public/**,\
bin/**,\
cucumber.js,\
cucumber-login.js,\
playwright.config.js

# Reporte LCOV generado por Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Esperar el resultado del Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300